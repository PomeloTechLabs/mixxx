# OHOS CI: build unsigned libmixxx HAP; publish on rc-*/dev-* tags.
#
# Modeled on the VintagePomeloPro build workflow (tag-driven releases with an
# unsigned build profile) and adapted to the Mixxx OHOS toolchain:
#   - runs in the prebuilt buildenv image (Qt for OHOS + vcpkg arm64-ohos +
#     HarmonyOS command-line tools) — build it once via
#     .github/workflows/ohos-buildenv.yml or locally (see docs/ohos/CI.md)
#   - reuses cmake/ohos + packaging/ohos scripts unmodified by reproducing
#     the /apps/harmony + /data/{out,vcpkg} layout inside the container
#   - rc-N tags must match packaging/ohos/version.json revision N
#     (rc-5 builds version 2.7.0.5); enforced by verify_release.py
#   - rc-* takes the Latest release badge, dev-* does not
#   - output is an UNSIGNED HAP; release signing stays a local, manual step
#
# Autonomously generated by an AI Agent.

name: Build Mixxx OHOS HAP (arm64-v8a, unsigned)

on:
  push:
    branches: [ohos-port, main]
    tags:
      - 'dev-*'
      - 'rc-*'
    paths-ignore:
      - 'docs/**'
      - '**.md'
      - '.gitignore'
      - 'LICENSE*'
  pull_request:
    branches: [ohos-port]
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release tag (dev-xx / rc-xx, empty = build only)'
        required: false
        type: string

permissions:
  contents: write
  packages: read

jobs:
  build:
    name: cmake + hvigor (unsigned)
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    outputs:
      source_sha: ${{ steps.source.outputs.commit }}
    defaults:
      run:
        shell: bash

    container:
      image: ghcr.io/pomelotechlabs/mixxx/buildenv-ohos:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: Configure git
        run: git config --global --add safe.directory '*'

      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_tag && format('refs/tags/{0}', inputs.release_tag) || github.sha }}
          fetch-depth: 1

      - name: Resolve release tag
        id: reltag
        env:
          RELEASE_TAG: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || inputs.release_tag }}
        run: echo "tag=${RELEASE_TAG}" >> "$GITHUB_OUTPUT"

      - name: Verify source version (tag must match version.json revision)
        id: source
        env:
          TAG: ${{ steps.reltag.outputs.tag }}
        run: |
          set -euo pipefail
          python3 packaging/ohos/ci/verify_release.py source \
            --repo . --tag "$TAG" --out ci-artifacts/ci-source.json
          echo "commit=$GITHUB_SHA" >> "$GITHUB_OUTPUT"

      # build-hap.sh and the Qt/cmake wiring expect the local container
      # layout; the image bakes /apps/harmony, /data/out and /data/vcpkg.
      - name: Map workspace onto the container layout
        run: |
          set -euxo pipefail
          mkdir -p /data/src /data/mixxx-build
          ln -sfn "$GITHUB_WORKSPACE" /data/src/mixxx
          test -f "$OHOS_SDK_ROOT/native/build/cmake/ohos.toolchain.cmake"
          test -d /data/out/qt-ohos
          /apps/harmony/bin/hvigorw --version

      # The vcpkg arm64-ohos protobuf config needs a HOST protoc; the image
      # carries only the target installed tree, so fetch the exact x64-linux
      # build (vcpkg 33.4.0) from the buildenv-assets prerelease. The gh CLI
      # is not installed inside the container; use the REST API.
      - name: Provision host protoc
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euxo pipefail
          asset_id="$(curl -sf -H "Authorization: Bearer $GH_TOKEN" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/releases/tags/buildenv-assets-1" \
            | python3 -c "import json,sys; a=[x for x in json.load(sys.stdin)['assets'] if x['name'].startswith('protoc-')]; print(a[0]['id'])")"
          mkdir -p /tmp/protoc-dl
          curl -sfL -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/octet-stream" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/releases/assets/$asset_id" \
            -o /tmp/protoc-dl/protoc
          install -Dm755 /tmp/protoc-dl/protoc \
            /data/vcpkg/vcpkg/packages/protobuf_x64-linux/tools/protobuf/protoc
          /data/vcpkg/vcpkg/packages/protobuf_x64-linux/tools/protobuf/protoc --version

      # CI builds unsigned: an empty signingConfigs profile makes hvigor
      # skip SignHap. The repo's own profile points at a developer machine's
      # debug material and would fail here. SDK versions target the CLT in
      # the buildenv image (HarmonyOS 6.1.1 / API 24); official store builds
      # keep using 6.1.0(23) from the local DevEco SDK. Restored after
      # packaging.
      # The buildenv base image predates some host-tool runtime libs the
      # local build container got via ad-hoc apt installs (qsb from
      # qt-host needs libEGL). Keep in sync with the Dockerfile apt set.
      - name: Ensure host-tool runtime libraries
        run: |
          set -euxo pipefail
          packages=()
          for p in libegl1 libgl1 libopengl0 libxkbcommon0 libfontconfig1 libglib2.0-0; do
            dpkg -s "$p" >/dev/null 2>&1 || packages+=("$p")
          done
          if [ "${#packages[@]}" -gt 0 ]; then
            apt-get update -qq
            apt-get install -y --no-install-recommends "${packages[@]}"
          fi
          /data/out/qt-host/bin/qsb --version

      - name: Provision unsigned build-profile.json5
        working-directory: packaging/ohos
        run: |
          set -euxo pipefail
          cp build-profile.json5 build-profile.json5.repo
          cat > build-profile.json5 <<'JSON5'
          {
            "app": {
              "signingConfigs": [],
              "products": [
                {
                  "name": "default",
                  "compatibleSdkVersion": "6.1.1(24)",
                  "runtimeOS": "HarmonyOS",
                  "targetSdkVersion": "6.1.1(24)",
                  "compileSdkVersion": "6.1.1(24)"
                }
              ],
              "buildModeSet": [
                { "name": "debug" },
                { "name": "release" }
              ]
            },
            "modules": [
              {
                "name": "entry",
                "srcPath": "./entry",
                "targets": [
                  {
                    "name": "default",
                    "applyToProducts": ["default"]
                  }
                ]
              }
            ]
          }
          JSON5

      - name: Configure and build libmixxx (Ninja, Release)
        run: |
          set -euxo pipefail
          # FFmpeg/dependency versions are resolved via pkg-config against
          # the vcpkg installed tree (matches the local build container).
          export PKG_CONFIG_PATH=/data/vcpkg/vcpkg/installed/arm64-ohos/usr/lib/pkgconfig
          cmake -S . -B /data/mixxx-build/ohos -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_TOOLCHAIN_FILE="$OHOS_SDK_ROOT/native/build/cmake/ohos.toolchain.cmake" \
            -DOHOS_ARCH=arm64-v8a \
            -DCMAKE_PREFIX_PATH=/data/out/qt-ohos \
            -DQT_HOST_PATH=/data/out/qt-host \
            -DCMAKE_FIND_ROOT_PATH="/data/out/qt-ohos;/data/vcpkg/vcpkg/installed/arm64-ohos" \
            -DBUILD_TESTING=OFF -DQML=ON -DFFMPEG=ON \
            -DProtobuf_PROTOC_EXECUTABLE=/data/vcpkg/vcpkg/packages/protobuf_x64-linux/tools/protobuf/protoc \
            -DHID=OFF -DBULK=OFF -DPORTMIDI=OFF -DBROADCAST=OFF -DVINYLCONTROL=OFF \
            -DQTKEYCHAIN=OFF -DFAAD=OFF -DMAD=OFF -DMODPLUG=OFF \
            -DKEYFINDER=OFF -DLILV=OFF -DWAVPACK=OFF
          cmake --build /data/mixxx-build/ohos -j"$(nproc)"

      - name: Stage into the HAP project (libs, QML, resources)
        run: |
          set -euxo pipefail
          STAGE_ONLY=1 bash packaging/ohos/build-hap.sh

      - name: Assemble unsigned HAP (hvigor, release mode)
        working-directory: packaging/ohos
        run: |
          set -euxo pipefail
          /apps/harmony/bin/hvigorw --mode module \
            -p module=entry@default -p product=default -p buildMode=release \
            assembleHap --no-daemon > /tmp/hvigor.log 2>&1 || {
              tail -50 /tmp/hvigor.log; exit 1; }
          tail -5 /tmp/hvigor.log

      - name: Restore repo build profile
        if: always()
        working-directory: packaging/ohos
        run: mv -f build-profile.json5.repo build-profile.json5 || true

      - name: Verify and locate HAP
        id: art
        env:
          TAG: ${{ steps.reltag.outputs.tag }}
        run: |
          set -euxo pipefail
          hap="packaging/ohos/entry/build/default/outputs/default/entry-default-unsigned.hap"
          test -s "$hap"
          python3 packaging/ohos/ci/verify_release.py hap \
            --repo . --hap "$hap" --tag "$TAG" --out ci-artifacts/ci-artifact.json
          echo "hap=$hap" >> "$GITHUB_OUTPUT"

      - name: Upload HAP
        uses: actions/upload-artifact@v4
        with:
          name: mixxx-ohos-unsigned-${{ steps.source.outputs.commit }}
          path: |
            ${{ steps.art.outputs.hap }}
            ci-artifacts/ci-source.json
            ci-artifacts/ci-artifact.json
          if-no-files-found: error
          retention-days: 14

      - name: Upload build logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs-${{ github.sha }}
          path: |
            /tmp/hvigor.log
            /data/mixxx-build/ohos/CMakeFiles/CMakeOutput.log
            /data/mixxx-build/ohos/CMakeFiles/CMakeError.log
          if-no-files-found: ignore
          retention-days: 7

  release:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-24.04
    if: startsWith(github.ref, 'refs/tags/dev-') || startsWith(github.ref, 'refs/tags/rc-') || github.event.inputs.release_tag != ''

    steps:
      - name: Checkout (for changelog)
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.build.outputs.source_sha }}
          fetch-depth: 0
          fetch-tags: true

      - name: Determine release tag & Latest ownership
        id: tag
        env:
          REQUESTED_TAG: ${{ inputs.release_tag }}
          SOURCE_SHA: ${{ needs.build.outputs.source_sha }}
        run: |
          if [ -n "$REQUESTED_TAG" ]; then
            tag="$REQUESTED_TAG"
          else
            tag="${GITHUB_REF#refs/tags/}"
          fi
          [[ "$tag" =~ ^(rc|dev)-[0-9]+$ ]] || exit 1
          if ! git rev-parse -q --verify "refs/tags/$tag^{commit}" >/dev/null; then
            git fetch --depth=1 --no-tags origin "refs/tags/$tag"
            git update-ref "refs/tags/$tag" FETCH_HEAD
          fi
          test "$(git rev-parse "refs/tags/$tag^{commit}")" = "$SOURCE_SHA"
          # rc-* owns the Latest badge, dev-* does not.
          case "$tag" in
            dev-*) make_latest=false ;;
            *)     make_latest=true ;;
          esac
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "make_latest=$make_latest" >> "$GITHUB_OUTPUT"

      - name: Download HAP artifact
        uses: actions/download-artifact@v4
        with:
          name: mixxx-ohos-unsigned-${{ needs.build.outputs.source_sha }}
          path: ./release-assets

      - name: Rename artifact with version
        run: |
          set -eux
          cd release-assets
          mapfile -t haps < <(find . -type f -name '*.hap')
          test "${#haps[@]}" -eq 1
          for f in "${haps[@]}"; do
            mv "$f" "PomeloMixxx-${{ steps.tag.outputs.tag }}-arm64-v8a-unsigned.hap"
          done
          ls -lh

      - name: Generate changelog
        env:
          SOURCE_SHA: ${{ needs.build.outputs.source_sha }}
        run: |
          prev_tag=$(git describe --tags --abbrev=0 "${{ steps.tag.outputs.tag }}^" 2>/dev/null || echo "")
          if [ -n "$prev_tag" ]; then
            {
              echo "## Changes since \`$prev_tag\`"
              echo
              git log --pretty=format:'- %s (%h)' "$prev_tag..${{ steps.tag.outputs.tag }}"
            } > changelog.md
          else
            echo "## Initial release" > changelog.md
          fi
          {
            echo
            echo
            echo "---"
            echo
            echo "**Note**: this HAP is **unsigned**. Sign it with your release"
            echo "materials before store submission or installation."
            echo
            echo "Built from commit \`${SOURCE_SHA:0:7}\`."
          } >> changelog.md
          cat changelog.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: Mixxx OHOS ${{ steps.tag.outputs.tag }}
          body_path: changelog.md
          files: |
            release-assets/*.hap
            release-assets/*.json
          draft: false
          prerelease: false
          make_latest: ${{ steps.tag.outputs.make_latest }}
          fail_on_unmatched_files: true

# Autonomously generated by an AI Agent.
