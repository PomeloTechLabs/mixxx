# Publishes the OHOS buildenv image to GHCR from docker-save parts stored as
# release assets. Used when the local machine has no GHCR push credentials:
# docker save | gzip | split locally, upload the parts to a prerelease
# (repo-level permissions are enough), then run this workflow — it downloads
# the parts, docker loads the image and pushes with the built-in
# GITHUB_TOKEN, which does have packages:write inside Actions.
#
# Local side (see packaging/ohos/ci/build-image-from-volumes.sh to build):
#   bash packaging/ohos/ci/build-image-from-volumes.sh
#   mkdir -p parts && cd parts
#   docker save ghcr.io/pomelotechlabs/mixxx/buildenv-ohos:latest \
#     | gzip -1 | split -b 1900M - buildenv-ohos.tar.gz.part-
#   gh release create buildenv-assets-1 --prerelease --notes "buildenv image parts" --target ohos-port
#   gh release upload buildenv-assets-1 buildenv-ohos.tar.gz.part-*
# Then: Actions -> OHOS buildenv publish (from release assets) -> Run.
#
# Autonomously generated by an AI Agent.

name: OHOS buildenv publish (from release assets)

on:
  workflow_dispatch:
    inputs:
      asset_tag:
        description: 'Release tag holding buildenv-ohos.tar.gz.part-* assets'
        required: true
        type: string
      keep_assets:
        description: 'Keep the part files on the release after publishing'
        required: false
        default: false
        type: boolean

permissions:
  contents: write
  packages: write

jobs:
  publish:
    name: docker load + push (ghcr.io)
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Resolve image name (GHCR requires lowercase)
        id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}/buildenv-ohos" >> "$GITHUB_OUTPUT"

      - name: Download image parts
        env:
          GH_TOKEN: ${{ github.token }}
          ASSET_TAG: ${{ inputs.asset_tag }}
        run: |
          set -euxo pipefail
          mkdir -p parts
          gh release download "$ASSET_TAG" --repo "$GITHUB_REPOSITORY" \
            --pattern 'buildenv-ohos.tar.gz.part-*' --dir parts
          ls -lh parts

      - name: Load image
        run: |
          set -euxo pipefail
          cat parts/buildenv-ohos.tar.gz.part-* | gzip -d | docker load
          docker images --format '{{.Repository}}:{{.Tag}} {{.Size}}' | grep buildenv-ohos

      - name: Push to GHCR
        env:
          GH_TOKEN: ${{ github.token }}
          ACTOR: ${{ github.actor }}
          IMAGE: ${{ steps.image.outputs.name }}
        run: |
          set -euxo pipefail
          echo "$GH_TOKEN" | docker login ghcr.io -u "$ACTOR" --password-stdin
          docker tag ghcr.io/pomelotechlabs/mixxx/buildenv-ohos:latest "$IMAGE:latest"
          docker tag "$IMAGE:latest" "$IMAGE:${{ inputs.asset_tag }}"
          docker push "$IMAGE:latest"
          docker push "$IMAGE:${{ inputs.asset_tag }}"
          docker manifest inspect "$IMAGE:latest" >/dev/null

      - name: Smoke-test the pushed image
        run: |
          set -euxo pipefail
          docker pull "${{ steps.image.outputs.name }}:latest"
          docker run --rm "${{ steps.image.outputs.name }}:latest" bash -c '
            test -f "$OHOS_SDK_ROOT/native/build/cmake/ohos.toolchain.cmake" \
            && test -d /data/out/qt-ohos/usr/lib/cmake/Qt6 \
            && test -d /data/vcpkg/vcpkg/installed/arm64-ohos/usr/lib \
            && /apps/harmony/bin/hvigorw --version'

      - name: Clean up release assets
        if: ${{ !inputs.keep_assets }}
        env:
          GH_TOKEN: ${{ github.token }}
          ASSET_TAG: ${{ inputs.asset_tag }}
        run: |
          gh release view "$ASSET_TAG" --repo "$GITHUB_REPOSITORY" --json assets \
            --jq '.[].name' | grep '^buildenv-ohos.tar.gz.part-' \
            | xargs -r gh release delete-asset "$ASSET_TAG" --repo "$GITHUB_REPOSITORY" --yes \
            || echo "asset cleanup skipped"

