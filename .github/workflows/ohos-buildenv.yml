# Rebuilds the OHOS buildenv image (Qt for OHOS + vcpkg + HarmonyOS CLI
# tools) and pushes it to GHCR. ohos-build.yml runs inside this image.
#
# Trigger manually when the toolchain changes (Qt pins, vcpkg commit, port
# list, SDK). First builds take 2-4 h mostly due to the Qt host+cross build;
# on a 4 vCPU hosted runner that can brush the 6 h job limit — building
# locally on a bigger machine and pushing (see docs/ohos/CI.md) is fine too:
#
#   docker build -f packaging/ohos/ci/Dockerfile \
#     --build-arg OHOS_CMDLINE_TOOLS_URL=<url-or-local-zip> -t buildenv-ohos .
#   docker tag buildenv-ohos ghcr.io/pomelotechlabs/mixxx/buildenv-ohos:latest
#   docker push ghcr.io/pomelotechlabs/mixxx/buildenv-ohos:latest
#
# The command-line tools zip can be provided either as the
# OHOS_CMDLINE_TOOLS_URL build arg (e.g. from a secret holding a signed
# download URL) or as packaging/ohos/ci/command-line-tools.zip in the build
# context (git-ignored; place it manually before a local build).
#
# Autonomously generated by an AI Agent.

name: OHOS buildenv image

on:
  workflow_dispatch:
    inputs:
      tools_url:
        description: 'command-line-tools zip URL (leave empty if zip is in the repo build context via secret)'
        required: false
        type: string

permissions:
  contents: read
  packages: write

jobs:
  image:
    name: docker build + push (ghcr.io)
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve image name (GHCR requires lowercase)
        id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}/buildenv-ohos" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: packaging/ohos/ci/Dockerfile
          push: true
          tags: |
            ${{ steps.image.outputs.name }}:latest
            ${{ steps.image.outputs.name }}:${{ github.sha }}
          build-args: |
            OHOS_CMDLINE_TOOLS_URL=${{ inputs.tools_url || secrets.OHOS_CMDLINE_TOOLS_URL }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

